name: Build Offline Human Atlas APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Web Bundle & Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install web dependencies and build offline bundle
        run: |
          npm ci
          npm run build

      - name: Copy built web dist into Android offline assets
        run: |
          rm -rf android/app/src/main/assets/atlas
          mkdir -p android/app/src/main/assets/atlas
          cp -r dist/* android/app/src/main/assets/atlas/
          # Android AssetMerger treats .bin and .bin.gz as duplicate resources;
          # APK ZIP compression compresses .bin files natively without double-packing.
          rm -f android/app/src/main/assets/atlas/models/*.bin.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper and build Debug APK
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
